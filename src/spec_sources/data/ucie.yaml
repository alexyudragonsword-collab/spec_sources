# ucie —— UCIe（Universal Chiplet Interconnect Express）规范的数：速率、BER、眼罩、摆幅、两种封装的 bump / reach / 宽度 / 修复。
#
# 标签：spec（对过原文，带 quote 与 section）/ survey（未核实，note 写明）/ derived（只由本库的 spec、
# survey 条目推出，note 或 cite 是公式）。本表不收 assumed：哪个库自己的取舍留在那个库的本地表。
# 只有条目自己的标签行写成"标签词 + 冒号"，说明文字里不写，所以对四个标签各跑一次 grep -c
# 都恰好等于该标签的条目数（tests/test_iron_rules.py 跑真的 grep）。
#
# 出处：条目从 d2d_link@6789810ccb6328324673222b2f64cc21f748451e src/d2d_link/data/spec/ucie_survey.yaml
# 迁入，键名加了 ucie. 前缀，其余字段逐字相等；只有 rx_eye_width_ui@24-32 的 note 改了一处：原文把
# "标签词 + 冒号"写进了说明（铁律 5；tests/test_extraction.py::CHANGED）。d2d_link 的裸键名到这里的键名
# 是 legacy_keys/d2d_link.yaml，给它的垫片用。cite / note 里的"本库"指 d2d_link，"示例 02"、ClockingConfig、
# TxConfig、lanes.spare_count、0.14.x 都是它的；下一次因核实改动这条时改成明确的库名（ROADMAP）。
# 键名里的 @lo-hi 是 d2d_link 的速率区间档（它的 survey_tiered 按数据速率挑）。
# 前缀：ucie.*。

entries:

  # ------------------------------------------------------------ UCIe 1.x：链路层面的数
  ucie.data_rates_gtps:
    value: [4, 8, 12, 16, 24, 32]
    unit: GT/s
    source: survey
    cite: "D. Das Sharma et al., 'Universal Chiplet Interconnect Express (UCIe): An Open Industry Standard for Innovations with Chiplets at Package Level', IEEE Trans. CPMT 2022; UCIe Consortium white paper (2022)"
    note: "未核实:速率档按综述所列,规范原文的速率表未读到。"

  ucie.forwarded_clock:
    value: "differential forwarded clock, DDR: clock rate = data rate / 2"
    unit: text
    source: survey
    cite: "Das Sharma 2022 (IEEE Micro / Hot Chips 34 UCIe 1.0 overview)"
    note: "未核实:本库 ClockingConfig.scheme = forwarded_ddr 依此;是否四分之一速率等变体未查。"

  ucie.raw_ber_target:
    value: 1.0e-27
    unit: BER
    source: survey
    cite: "UCIe Consortium white paper (2022) 'BER < 1e-27'; Das Sharma 2022"
    note: "未核实:综述把 1e-27 作为无 FEC 的原始 BER 目标;另有说法 24/32 GT/s 配 CRC+retry 放宽到 1e-15。两种说法都未见原文,此处取严格值。"

  ucie.raw_ber_with_retry:
    value: 1.0e-15
    unit: BER
    source: survey
    cite: "UCIe 1.0 overview talks (Hot Chips 34, 2022)"
    note: "未核实:据称 24 / 32 GT/s 允许的原始 BER(有 CRC + retry);本库不建协议层,只留此参数位。"

  ucie.rx_eye_height_mv:
    value: 40.0
    unit: mV
    source: survey
    cite: "public UCIe 1.0 electrical summaries (eye mask 'EH ≥ 40 mV')"
    note: "未核实:收端眼高下限;原文的 eye-mask 表与所属速率档 / 封装未读到,数值待确认。"

  ucie.rx_eye_width_ui:
    value: 0.75
    unit: UI
    source: survey
    cite: "public UCIe 1.0 electrical summaries (eye mask 'EW ≥ 0.75 UI')"
    note: "未核实:收端眼宽下限;同上,数值待确认。0.14.0 起 24–32 GT/s 由下面的区间档接管;表外速率也落到这一条,并告警。"

  ucie.rx_eye_width_ui@24-32:
    value: 0.65
    unit: UI
    source: survey
    cite: "Analysis of UCIe 48/64 GT/s Electrical Links (2025, ResearchGate 395249532), quoting the UCIe eye mask: 'For data rates between 4 and 16 GT/s, the required values are EH/EW = 40 mV / 0.75 UI, and for data rates between 24 and 32 GT/s, the required values are EH/EW = 40 mV / 0.65 UI'"
    note: "未核实:二手转述(只读到检索摘要,论文原文与 UCIe 规范原文都未读)。采用于 0.14.0(用户 2026-11-05 决定;0.14.5 起是一条 24–32 GT/s 区间,此前 @24、@32 两条只认这两个速率);规范原文到了改成 spec 标签或删去。"

  ucie.tx_swing_vpp:
    value: 0.4
    unit: V
    source: survey
    cite: "Das Sharma 2022: ~0.4 V single-ended swing, terminated at the higher rates"
    note: "未核实:发端摆幅标称值;本库 TxConfig.swing_vpp 默认值取自此。"

  # ------------------------------------------------------------ 标准封装
  ucie.standard.bump_pitch_um:
    value: [100, 130]
    unit: um
    source: survey
    cite: "UCIe Consortium white paper (2022): standard package bump pitch 100-130 um"
    note: "未核实。"

  ucie.standard.reach_mm:
    value: 25.0
    unit: mm
    source: survey
    cite: "UCIe Consortium white paper (2022): standard package reach up to 25 mm"
    note: "未核实:示例 02 的 reach 上限与此比;差 2× 以上在 cairn/LOG.md 写原因。"

  ucie.standard.module_width_lanes:
    value: 16
    unit: lanes
    source: survey
    cite: "Das Sharma 2022: standard package module x16"
    note: "未核实。"

  ucie.standard.lane_repair:
    value: "width degradation (x16 -> x8), no spare lanes"
    unit: text
    source: survey
    cite: "Das Sharma 2022 / UCIe 1.0 overview"
    note: "未核实:标准封装靠降宽度修复,先进封装靠备用 lane;本库两种都做成配置项。"

  # ------------------------------------------------------------ 先进封装
  ucie.advanced.bump_pitch_um:
    value: [25, 55]
    unit: um
    source: survey
    cite: "UCIe Consortium white paper (2022): advanced package bump pitch 25-55 um"
    note: "未核实。"

  ucie.advanced.reach_mm:
    value: 2.0
    unit: mm
    source: survey
    cite: "UCIe Consortium white paper (2022): advanced package reach up to 2 mm"
    note: "未核实。"

  ucie.advanced.module_width_lanes:
    value: 64
    unit: lanes
    source: survey
    cite: "Das Sharma 2022: advanced package module x64"
    note: "未核实。"

  ucie.advanced.lane_repair:
    value: "spare lanes (lane repair by remapping)"
    unit: text
    source: survey
    cite: "Das Sharma 2022 / UCIe 1.0 overview"
    note: "未核实:备用 lane 的数量未见原文,本库由 lanes.spare_count 配置。"
