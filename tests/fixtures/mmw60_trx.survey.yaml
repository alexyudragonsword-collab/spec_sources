    source: spec
    cite: "H. Asada, K. Matsushita, K. Bunsen, K. Okada, A. Matsuzawa, 'A 60 GHz CMOS Power Amplifier Using Capacitive Cross-Coupling Neutralization with 16 % PAE'（Tokyo Institute of Technology）；作者实验室站点 publications/2011/EuMC/asdh_EuMC2011_v5_paper.pdf，会议名按文件路径是 EuMC 2011，PDF 本身没有印；2026-11-12 读原文"
    section: "Abstract；测量结果一节（Fig. 10）；Table I"
    quote: "The 3-stage differential power amplifier is fabricated in a 65 nm CMOS process and evaluated with 1.2 V power supply. The power amplifier achieves power gain of 23.2 dB, output power of 10 dBm at 1 dB compression point, saturated output power of 14.6 dBm, peak PAE of 16.3 %, and power consumption of 135 mW. [...] The measured PAE at 1 dB compression point and the measured peak PAE are 7.9 % and 16.3 %, respectively."
    note: "60 GHz 单音测量（Fig. 10）。Psat − P1dB = 4.6 dB，在同一篇 Table I 收的 14 个 60 GHz CMOS PA 里偏软（中位 3.3 dB，见 pa60.eumc2011_table1）。'surveyed' 一档的 PA 取它（assumed.pa60_surveyed_pick）。原文没有 AM/PM。"

