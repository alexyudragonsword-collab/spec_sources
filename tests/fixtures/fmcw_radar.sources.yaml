  # ---------------------------------------------------------------- 大气(survey)
  oxygen.60g_db_per_km:
    value: 15.0
    unit: dB/km
    source: survey
    cite: "ITU-R P.676: specific attenuation by atmospheric oxygen peaks at ~15 dB/km around 60 GHz at sea level (summaries of the recommendation's Figure 1; original text not read)"
    note: "未核实:只读到转述;本库按往返距离 2R 计,10 m 处 0.3 dB。"
  oxygen.77g_db_per_km:
    value: 0.4
    unit: dB/km
    source: survey
    cite: "ITU-R P.676: oxygen attenuation falls to a few tenths of a dB/km by 77 GHz (summaries; original text not read)"
    note: "未核实。"

  # ---------------------------------------------------------------- 目标 RCS 典型值(survey)
  rcs.human_dbsm:
    value: -10.0
    unit: dBsm
    source: survey
    cite: "human body RCS at mmWave quoted as 0.1-1 m^2 depending on aspect (radar handbooks and 60 / 77 GHz sensing papers; no single original read)"
    note: "未核实:取区间低端 0.1 m^2;对 SNR 是线性的 1 dB 对 1 dB。"
  rcs.car_dbsm:
    value: 10.0
    unit: dBsm
    source: survey
    cite: "passenger car RCS at 77 GHz quoted as ~10 dBsm (automotive radar literature surveys; original measurements not read)"
    note: "未核实。"
  rcs.corner_reflector_dbsm:
    value: 20.0
    unit: dBsm
    source: survey
    cite: "a trihedral corner reflector of ~10 cm edge at 60 GHz: sigma = 4 pi a^4 / (3 lambda^2) ~ 10^2 m^2 (textbook formula; a convenient test target, not a measurement)"
    note: "未核实:按公式量级,未对照实物。"

  # ---------------------------------------------------------------- 窗函数主瓣宽度(survey,Harris 1978 表)
  window.rect_3db_bins:
    value: 0.89
    unit: bins
    source: survey
    cite: "F. J. Harris, 'On the use of windows for harmonic analysis with the DFT', Proc. IEEE 1978, Table I: -3 dB mainlobe width of the rectangular window (two-digit table value; original table not re-read)"
    note: "未核实:两位有效数字;示例 03 与 tests/test_processing.py 用它做 5 % 以内的对照。"
  window.hann_3db_bins:
    value: 1.44
    unit: bins
    source: survey
    cite: "Harris 1978, Table I: Hanning (alpha = 2) -3 dB width"
    note: "未核实。"
  window.hamming_3db_bins:
    value: 1.30
    unit: bins
    source: survey
    cite: "Harris 1978, Table I: Hamming -3 dB width"
    note: "未核实。"
  window.blackman_3db_bins:
    value: 1.68
    unit: bins
    source: survey
    cite: "Harris 1978, Table I: exact Blackman -3 dB width"
    note: "未核实。"
