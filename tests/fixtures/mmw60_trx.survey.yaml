  pa60.asada_eumc2011:
    value: {gain_db: 23.2, p1db_dbm: 10.0, psat_dbm: 14.6, pae_peak: 0.163, pae_at_p1db: 0.079, pdc_mw: 135.0, vdd_v: 1.2}
