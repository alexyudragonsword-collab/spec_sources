    quote: "The advanced package supports spare lanes to handle faulty lanes (including clock, valid, sideband, etc) where as the standard package supports width degradation to handle failures. [...] Redundancy & Repair for Advanced Package [...] Two per 32 bits [...] Apply repair for Advanced pkg and Width degrade for Standard pkg"
