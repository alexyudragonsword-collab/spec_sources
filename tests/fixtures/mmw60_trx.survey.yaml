    quote: "The PA is capable of outputting 13.2 dBm saturation power (Psat), 10.2 dBm power at 1-dB compression point (P1dB) and achieving 15.0% peak power-added efficiency (PAE). [...] The P1dB is reduced from 10.2 dBm to 5.8 dBm when VPA is [reduced] [...] the measured EVM is from 11.7% (-18.6 dB) to 12.9% (-17.8 dB) for low output power (Pout = 5 dBm) [...] While at high output power (Pout = 10 dBm), the measurement value of the EVM is 13.1% (-17.7 dB)"
