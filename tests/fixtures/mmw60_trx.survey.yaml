    cite: "IEEE 802.11ax-2021 Table 27-31 'LDPC tone mapping distance' by RU size（242: 9、484: 12、996: 20，2×996 / 4×996 每个 996 段各 20）；EHT 沿用（802.11be D3.0 §36.3.12.8）"
    note: "未核实：原文表未贴入。D_TM 只影响频率选择性信道上的 PER（平坦信道不变）；N_SD 必须整除 D_TM（234/9、468/12、980/20）。"

  survey.ldpc_ppdu_encoding_thresholds:
    value: {l1296_over_648: 912, l1944_over_1296: 1464, l1944_over_1296_two_cw: 2916, punc_frac_a: 0.1, shrt_ratio_b: 1.2, punc_frac_c: 0.3}
    unit: bits / ratios
    source: survey
    cite: "IEEE 802.11-2020 §19.3.11.7.5 'LDPC PPDU encoding process' steps (b)–(e) and Table 19-16（码长与码字数选取、缩短 / 删余 / 重复及加一个符号的两个条件）；VHT / HE / EHT 沿用同一流程"
    note: "未核实：原文未贴入。本库按 HT/VHT 的流程（预 FEC 填充到 N_SYM·N_DBPS，等价于 HE 的 a = 4），不建 HE/EHT 的 a 因子与 PE 字段（assumed.eht_prefec_padding）。"

  assumed.eht_prefec_padding:
    value: "a=4 (HT/VHT procedure)"
    unit: rule
    source: assumed
    cite: "本库"
    note: "11be 数据域的预 FEC 填充按 HT/VHT 流程把 SERVICE+PSDU 填到整符号，不做 HE/EHT 的 a 因子（1–4）与 Packet Extension：PER 对此不敏感（只改最后一个符号的有效载荷），吞吐差 < 1 个符号。EHT 的 11 位扰码器也不建（PER 与扰码序列无关，仍用 7 位）。"

  assumed.ldpc_max_iterations:
    value: 30
    unit: iterations
    source: assumed
    cite: "本库；接收机算法选择"
    note: "归一化 min-sum 的最大迭代数（综合征为零即提前停止）；30 次在 1944 码上离 50 次的 PER 差 < 0.1 dB 量级，功率列按它计 LDPC 解码能耗。"

  assumed.ldpc_minsum_scale:
    value: 0.8
    unit: ratio
    source: assumed
    cite: "本库；接收机算法选择"
    note: "归一化 min-sum 的缩放因子 α；0.75–0.8 是这类码的常用值，LLR 的绝对尺度对 min-sum 无影响。"

  # ------------------------------------------------------------ A3：解码器上限
  assumed.decoder_cap_margin_db:
    value: 3.0
    unit: dB
    source: assumed
    cite: "本库"
    note: "'解码器上限'判定可达的口径：EVM 底板要比该 MCS 的 ideal 门限所容忍的噪声低 3 dB（−floor ≥ T + 3），此时底板吃掉 3.0 dB 灵敏度；取 0 dB 时所需 SNR 发散。同台表灵敏度节跑 1 / 6 dB 两端。与 assumed.mcs_evm_margin_db（发射机合规口径的余量）是两回事。"

  # ------------------------------------------------------------ 拓扑 A：IF 延伸（A1）
  assumed.ifext_if_hz:
    value: 6.48e+9
    unit: Hz
    source: assumed
    cite: "本库；6 GHz 频段（5.925–7.125 GHz）里的一个信道中心，使固定 LO 为整 54.0 GHz"
    note: "拓扑 A 的中频：芯片的信道所在的频率。载频 60.48 GHz 时 f_LO = 54.00 GHz。换信道靠芯片在 6 GHz 段内调 IF，固定 LO 不动（59.925–61.125 GHz 可达）。"

  assumed.ifext_lo_scheme:
    value: "fixed_lo_x3"
    unit: scheme
    source: assumed
    cite: "本库；60 GHz 常见的 LO 生成方式之一（约 20 GHz 的 PLL 接三倍频）"
    note: "固定 LO 的倍频数：×3（PLL 18.0 GHz）或 ×4（13.5 GHz）。相噪用参数化的 1 极 1 零剖面直接给在 LO 输出端，所以 N 只进频率规划与 PLL 频率，不改相噪数字；pllsim ×10 剖面那几行是零中频 60.48 GHz 的（survey.clock_profile_wu19_x10）；对方模型不覆盖 18.0 / 13.5 GHz，拓扑 A 没有 pllsim 推出来的行（pll_simulator#71）。"

  assumed.ifext_filter:
    value: {bandwidth_hz: 1.2e+9, order: 5, ripple_db: 0.5, center_hz: 6.525e+9}
    unit: Chebyshev-I bandpass
    source: assumed
    cite: "本库；通带取整个 6 GHz 段（芯片在段内调 IF 换信道），0.5 dB 纹波 5 阶是 LTCC / 声学带通的常见量级，未查具体器件"
    note: "IF 带通滤波器的低通等效；信道离通带中心越远，带内纹波与群时延展宽越大。示例 06 有信道在通带边缘的灵敏度行。"

  assumed.ifext_image_rejection_db:
    value: 30.0
    unit: dB
    source: assumed
    cite: "本库；RF 预选滤波对 f_LO − f_IF 镜像带的抑制，未查具体器件"
    note: "接收侧镜像带的噪声折进信号带：噪声系数恶化 10·log10(1 + 10^(−IRR/10)) = 0.004 dB（30 dB）、0.41 dB（10 dB）。只有拓扑 A 有这一项（零中频没有镜像带），同台表里标出。"

  assumed.ifext_chip_seed:
    value: 5
    unit: seed
    source: assumed
    cite: "本库；wifitrx handoff/runner.build_calibrated_trx 的默认 seed"
    note: "拓扑 A 的芯片是 wifitrx 自己随机化损伤后跑完校准序列的收发机（芯片原样）；seed 选哪一颗芯片。示例 06 有换芯片的灵敏度行。"

  assumed.ifext_chip_oversampling:
    value: 4
    unit: x bandwidth
    source: assumed
    cite: "本库；wifitrx 自己的波形默认 4 倍过采样，DPD 的 ACLR 观测要 fs ≥ 3 × BW"
    note: "拓扑 A 里芯片的 DAC / ADC 采样率。拓扑 B 用 2 倍（fs_eff 已是数 GS/s）。"

  assumed.ifext_dpd_max_iterations:
    value: 2
    unit: iterations
    source: assumed
    cite: "本库；wifitrx cal/dpd_cal.py::calibrate_dpd 的默认 n_iter = 2"
    note: "60 GHz 观测回环上重训 DPD 时交给 wifitrx 的 DPD 步试的轮数。wifitrx 0.7.39 起该步自己在观测通路上读“不加预失真”和每一轮、写入最好的；本库再把它留下的放回同一输出功率，和芯片上原有的预失真器比，留好的。轮数越多在软压缩 PA 靠近饱和时越差：回退 8 dB 处观测读数 不加 / 第 1 / 2 / 3 轮是 −18.4 / −20.6 / −14.1 / +1.4 dB（示例 06 §3 用上限 3 展示）。"

  assumed.mlo_sub7:
    value: {carrier_hz: 5.5e+9, snr_db: 20.0}
    unit: sub-7 GHz link
    source: assumed
    cite: "本库；MLO 的 sub-7 链路取 5 GHz 段一个信道，SNR 20 dB"
    note: "拓扑 A 的 CFO 接法（铁律 3）：sub-7 链路用 L-STF + L-LTF 估出自己的 CFO，乘 f_c / f_sub7（= 11.0）预补偿 60 GHz 链路，残差 = sub-7 估计误差 × 频率比。前提是每台设备的 sub-7 LO、芯片 IF LO 与 60 GHz 固定 LO 同源一颗晶振（assumed.mlo_common_reference）。"

  assumed.mlo_common_reference:
    value: true
    unit: bool
    source: assumed
    cite: "本库；多链路设备各射频共用一颗参考晶振是常规做法"
    note: "不成立时（60 GHz 级自带晶振）sub-7 的估计与 60 GHz 的 CFO 无关，MLO 预补偿失效，2.42 MHz 落在芯片 L-STF 的 ±625 kHz 之外。"

  # ------------------------------------------------------------ C1 / C2：接收机改进
  assumed.cpe_window_symbols:
    value: 17
    unit: OFDM symbols
    source: assumed
    cite: "本库；接收机算法选择"
    note: "跨符号导频 CPE 的 MMSE 合并窗口（rx/tracking.py）。Liu K = 8 MCS0 flat 上 5 / 9 / 17 / 33 的 PER 1e-2 点在 2.5–2.9 dB 之间（逐符号 4.5 dB），对窗口不敏感：合并权重 g 由导频残差自己量，窗口只定平滑估计的噪声。少于 3 个符号的包退回逐符号。示例 00 的灵敏度行给 5 与 33。"

  assumed.ce_smooth_max_tones:
    value: 9
    unit: tones
    source: assumed
    cite: "本库；wifitrx DEFAULT_CE_SMOOTH_TONES = 9"
    note: "信道估计平滑跨度自动选的上限（rx/tracking.py::auto_smooth_span）；平坦信道上音数多时取到上限（996 音 100 % 的包），56 音上受估计自身散布限制只有约 2/3 的包取到（ROADMAP C6）；选择性信道上按估计自己的音间自相关取 1–3。"
