# liu2025 —— Liu 2025（Wi-Fi 8 毫米波 upclocking）论文里的数，与只由它们推出的 derived。
#
# 标签：spec（对过原文，带 quote 与 section）/ survey（未核实，note 写明）/ derived（只由本库的 spec、
# survey 条目推出，note 或 cite 是公式）。本表不收 assumed：哪个库自己的取舍留在那个库的本地表。
# 只有条目自己的标签行写成"标签词 + 冒号"，说明文字里不写，所以对四个标签各跑一次 grep -c
# 都恰好等于该标签的条目数（tests/test_iron_rules.py 跑真的 grep）。
#
# 出处：条目从 mmw60_trx@13024e0b012923071d827cc557b0da5eb9a9b2aa src/mmw60/data/spec/survey.yaml
# 逐字迁入，每个字段与源表相等（tests/test_extraction.py 对 tests/fixtures/ 里的副本逐条比）。
# 所以 cite / note 里的"本库"指 mmw60_trx，cairn/…、examples/…、tests/…、config.…、frontend.… 是它仓库里的路径，
# assumed.* 是它本地表里的条目；这些写法在条目下一次因核实而改动时改成明确的库名（ROADMAP）。
#
# Liu 2025 = X. Liu, T. Chen, Y. Dong, Z. Mao, M. Gan, X. Yang, J. Lu, "Wi-Fi 8: Embracing the
# Millimeter-Wave Era", IEEE Commun. Mag., Mar. 2025; 读的是 arXiv:2309.16813 v1 (2023-09-28,
# 含 PER 图 Fig. 4) 与 v2 (2024-07-08, 图被删、正文仍引用)。刊出版未取得。
# 前缀：liu2025.*。

entries:

  # ------------------------------------------------------------ Liu 2025 Table I / II、Sec. I / III / V-A / V-B
  liu2025.mcs_list:
    value: [0, 1, 4]
    unit: MCS index
    source: survey
    cite: "Liu 2025, Table II 'MCS: MCS 0, MCS 1 and MCS 4'; Sec. V-A 'BPSK, QPSK, and 16-QAM respectively'"
    note: "未核实：刊出版未读到；arXiv v1/v2 一致。"

  liu2025.ppdu_format:
    value: "VHT"
    unit: text
    source: survey
    cite: "Liu 2025, Table II 'PPDU type: VHT format'; Sec. V-A 'very high throughput (VHT) format, which is used in IEEE 802.11ac'"
    note: "未核实：原文未说基准带宽 / FFT 点数；见 assumed.base_bandwidth_hz。"

  liu2025.channel_model:
    value: "802.11ad conference room (CR)"
    unit: text
    source: survey
    cite: "Liu 2025, Table II '802.11ad channel model'; Sec. V-A 'the conference room (CR) channel model in IEEE 802.11ad standard'"
    note: "未核实：CR 模型（Maltsev, IEEE 802.11-09/0334）的 tap 表本库没有；见 assumed.cr_rms_delay_ns。"

  liu2025.antennas:
    value: "1T1R, no beamforming"
    unit: text
    source: survey
    cite: "Liu 2025, Table II 'TX/RX: 1T1R'; Sec. V-A 'single-antenna system without utilizing beamformed transmission'"
    note: "未核实。"

  liu2025.carrier_hz:
    value: 73.44e+9
    unit: Hz
    source: survey
    cite: "Liu 2025, Table II 'fc: 73.44 GHz'; Sec. V-A 'the channel 8 defined in IEEE 802.11ay'"
    note: "未核实：11ay channel 8 中心频率值未与 802.11ay 原文核对。"

  liu2025.packet_bytes:
    value: 4096
    unit: byte
    source: survey
    cite: "Liu 2025, Table II 'Packet size: 4096 bytes'"
    note: "未核实。本库当 PSDU 长度用（APEP_LENGTH）。"

  liu2025.xo_ppm_tx:
    value: 20
    unit: ppm
    source: survey
    cite: "Liu 2025, Sec. V-A 'the oscillator inaccuracy on both TX and RX sides are 20 part per million (ppm)'"
    note: "未核实。"

  liu2025.xo_ppm_rx:
    value: 20
    unit: ppm
    source: survey
    cite: "Liu 2025, Sec. V-A（同上）"
    note: "未核实。"

  liu2025.cfo_max_hz:
    value: 2.94e+6
    unit: Hz
    source: survey
    cite: "Liu 2025, Sec. V-A 'the system should compensate for a total of 40 ppm CFO. For a 73.44 GHz system we set up, the CFO is up to ± 2.94 MHz'"
    note: "未核实。40e-6 × 73.44e9 = 2.9376 MHz，原文四舍五入到 2.94。本库仿真用 ppm × fc 现算（铁律 3），不用这个数。"

  liu2025.stf_capture_hz:
    value: 625.0e+3
    unit: Hz
    source: survey
    cite: "Liu 2025, Sec. V-A 'the short training field (STF) and long training field (LTF) sequences in sub-7 GHz can resolve a frequency offset up to ± 625 KHz and ± 156.25 KHz, respectively'"
    note: "未核实（原文数字）。本库在 cairn/upclocking.md 自己推：L-STF 周期 0.8 µs → ±1/(2·0.8 µs) = ±625 kHz。"

  liu2025.ltf_capture_hz:
    value: 156.25e+3
    unit: Hz
    source: survey
    cite: "Liu 2025, Sec. V-A（同上）"
    note: "未核实（原文数字）。L-LTF 周期 3.2 µs → ±156.25 kHz = ±SCS/2。"

  liu2025.scs_threshold_hz:
    value: 5.88e+6
    unit: Hz
    source: survey
    cite: "Liu 2025, Sec. V-A 'the subcarrier spacing of at least one training field should be larger than 5.88 MHz'; Sec. V-B 'dividing the minimum subcarrier spacing 5.88 MHz by the 1250 KHz ... only a larger upclocking version than 4.7 can rectify the CFO correctly'"
    note: "未核实（原文数字）。= 2 × 2.94 MHz，即 L-STF 有效子载波间距（4 × SCS）要大于两倍最大 CFO。"

  liu2025.k_threshold:
    value: 4.7
    unit: upclocking factor
    source: survey
    cite: "Liu 2025, Sec. V-B（同上）"
    note: "未核实（原文数字）。5.88 MHz / 1.25 MHz = 4.704。"

  liu2025.pn_f_pole_hz:
    value: 1.0e+6
    unit: Hz
    source: survey
    cite: "Liu 2025, Sec. V-A 'we use 1 pole, 1 zero phase noise model. The pole frequency fp and the zero frequency fz is set to 1 MHz and 100 MHz, respectively'"
    note: "未核实。原文无公式；PSD 形状见 tgad_em.pn_model_shape。"

  liu2025.pn_f_zero_hz:
    value: 100.0e+6
    unit: Hz
    source: survey
    cite: "Liu 2025, Sec. V-A（同上）"
    note: "未核实。"

  liu2025.pn_psd0_dbchz:
    value: -93.0
    unit: dBc/Hz
    source: survey
    cite: "Liu 2025, Sec. V-A 'the zero point of power spectral density (PSD) is -93 dBc/Hz'; 'Ignoring the flicker noise and the reference oscillator noise'"
    note: "未核实。原文未说相噪加在 TX、RX 还是两侧；见 assumed.pn_apply_sides。"

  liu2025.pa_obo_db:
    value: 8.0
    unit: dB
    source: survey
    cite: "Liu 2025, Sec. V-A 'PA OBO is set to 8 dB and the PA non-linearity model is modified Rapp model'"
    note: "未核实。原文无 Rapp 参数；参数取 tgad_em.*（11ad 评估方法学的 CMOS PA）。OBO 口径：平均输出功率低于饱和输出功率的 dB 数。"

  liu2025.table1_scs_hz:
    value: {4: 1.25e+6, 8: 2.5e+6, 16: 1.25e+6}
    unit: Hz per upclocking factor
    source: survey
    cite: "Liu 2025, Table I 'Subcarrier spacing: 1.25 MHz / 2.5 MHz / 1.25 MHz (802.11be part)'"
    note: "未核实。16× 一列按 802.11be 基准（78.125 kHz × 16），与 4×/8× 的 11ac 基准不是同一尺度；本库 Fig. 4 复现按 11ac 基准 312.5 kHz × K（16× = 5 MHz），因为 V-B 的 4.7 论证以 1.25 MHz(=4×312.5k) 为基。"

  liu2025.table1_bandwidth_hz:
    value: {4: [80.0e+6, 160.0e+6, 320.0e+6, 640.0e+6], 8: [160.0e+6, 320.0e+6, 640.0e+6, 1280.0e+6], 16: [320.0e+6, 640.0e+6, 1280.0e+6, 2560.0e+6, 5120.0e+6]}
    unit: Hz per upclocking factor
    source: survey
    cite: "Liu 2025, Table I 'Bandwidth'"
    note: "未核实。"

  liu2025.per_target:
    value: 1.0e-2
    unit: PER
    source: survey
    cite: "Liu 2025, Sec. V-B 'the SNR required to achieve the specified PER (10^-2)'"
    note: "未核实。本库 external_check 的比较点。"

  liu2025.receiver_cfo_statement:
    value: "refrained from using estimation and compensation algorithms for CFO and PN"
    unit: text
    source: survey
    cite: "Liu 2025, Sec. V-A 'In order to better illustrate the impact of hardware impairments, we refrained from using estimation and compensation algorithms for CFO and PN.'"
    note: "未核实，且与 V-B 的 4.7 门槛论证矛盾（该论证以 L-STF 自相关估计器在跑为前提）；本库示例 00 开标准 L-STF/L-LTF 估计，并另给'全关'诊断行。见 cairn/external-validation.md。"

  liu2025.mmwave_spectrum_ghz:
    value: 14
    unit: GHz
    source: survey
    cite: "Liu 2025, Sec. I/III '45 GHz and 60 GHz unlicensed mmWave bands ... a rich 14 GHz spectrum'"
    note: "未核实。本库里程碑 0 不用。"

  # ------------------------------------------------------------ 推导：只用上面的 liu2025.* 与 802.11ac 的 312.5 kHz 子载波间距
  liu2025.cfo_from_ppm_hz:
    value: 2.9376e+6
    unit: Hz
    source: derived
    cite: "(liu2025.xo_ppm_tx + liu2025.xo_ppm_rx) × 1e-6 × liu2025.carrier_hz"
    note: "40e-6 × 73.44e9。原文写 2.94 MHz。"

  liu2025.k_threshold_stf:
    value: 4.7
    unit: upclocking factor
    source: derived
    cite: "2 × liu2025.cfo_from_ppm_hz / (4 × 312.5 kHz) = 5.875 MHz / 1.25 MHz = 4.70"
    note: "L-STF 自相关范围 ±625 kHz × K ≥ 2.9376 MHz ⇔ K ≥ 4.70。见 cairn/upclocking.md。"

  liu2025.k_threshold_ltf_only:
    value: 18.8
    unit: upclocking factor
    source: derived
    cite: "liu2025.cfo_from_ppm_hz / 156.25 kHz = 18.8"
    note: "只靠 L-LTF 两段估计（±SCS/2）要 K ≥ 18.8：K = 16 也接不住 2.94 MHz，必须有 STF 粗估计。"
