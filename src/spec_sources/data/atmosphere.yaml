  itu_p676.method:
    value: "γo = 0.1820·f·(Σi Si·Fi + N″D(f)) [dB/km]; Si = a1·1e-7·p·θ^3·exp[a2·(1 − θ)]; Fi = (f/fi)·[(Δf − δ·(fi − f))/((fi − f)^2 + Δf^2) + (Δf − δ·(fi + f))/((fi + f)^2 + Δf^2)]; Δf = a3·1e-4·(p·θ^(0.8 − a4) + 1.1·e·θ), then Δf = sqrt(Δf^2 + 2.25e-6); δ = (a5 + a6·θ)·1e-4·(p + e)·θ^0.8; N″D(f) = f·p·θ^2·[6.14e-5/(d·(1 + (f/d)^2)) + 1.4e-12·p·θ^1.5/(1 + 1.9e-5·f^1.5)]; d = 5.6e-4·(p + e)·θ^0.8; θ = 300/T; e = ρ·T/216.7"
    unit: formula
    source: spec
    cite: "Recommendation ITU-R P.676-13 (08/2022), 'Attenuation by atmospheric gases and related effects'；www.itu.int（R-REC-P.676-13-202208-I，英文 PDF），2026-11-13 读原文"
    section: "Annex 1, §1, equations (1), (2a), (3), (4), (5), (6a), (6b), (7), (8), (9)"
    quote: "The specific gaseous attenuation is given by: γ = γo + γw = 0.1820 f (N″Oxygen(f) + N″Water Vapour(f)) (dB/km) (1) where γo and γw are the specific attenuations (dB/km) due to dry air (oxygen, pressure-induced nitrogen and non-resonant Debye attenuation) and water vapour, respectively, f is the frequency (GHz)"
    note: "只录了氧气（干空气）这一支。f 单位 GHz；p 是干空气压、e 是水汽分压（hPa，总压 = p + e）；T 单位 K。式 (5)–(9) 在 PDF 文本层里丢了希腊字母和 θ，是渲染原文第 7、10 页读的。"

  itu_p676.figure1_conditions:
    value: {p_hpa: 1013.25, t_c: 15.0, rho_standard_g_m3: 7.5, rho_dry_g_m3: 0.0}
    unit: "hPa, °C, g/m³, g/m³"
    source: spec
    cite: "Recommendation ITU-R P.676-13 (08/2022), 'Attenuation by atmospheric gases and related effects'；www.itu.int（R-REC-P.676-13-202208-I，英文 PDF），2026-11-13 读原文"
    section: "Annex 1, §1, text before Figure 1"
    quote: "Figure 1 shows the specific attenuation using the prediction method, calculated from 0 to 1 000 GHz at 1 GHz intervals, for a pressure of 1 013.25 hPa, temperature of 15 C for the cases of a water vapour density of 7.5 g/m3 (Standard) and a dry atmosphere (Dry)."
    note: "原文没说 1013.25 hPa 是总压还是干空气分压。干大气（e = 0）两种读法相同，所以本库只按干大气推导。湿空气在 60 GHz 两种读法差约 0.12 dB/km（按总压读 14.50，按干空气压读 14.62）。"

  # ------------------------------------------------------------ 推导：海平面干大气的氧气比衰减
  itu_p676.gamma_o_dry_sea_level:
    value: {f_ghz: [57.0, 60.0, 64.0, 76.0, 77.0, 77.5, 81.0], db_per_km: [10.079, 14.651, 6.836, 0.108, 0.096, 0.091, 0.065]}
    unit: "GHz, dB/km"
    source: derived
    cite: "itu_p676.method 用 itu_p676.oxygen_lines，在 itu_p676.figure1_conditions 的干大气（1013.25 hPa、15 °C、ρ = 0）下逐线求和；保留三位小数"
    note: "公式：γo = 0.1820·f·(Σ Si·Fi + N″D)，各项见 itu_p676.method。频点取 fmcw_radar 两个频段的上下沿与中心（57–64 GHz、76–81 GHz）。独立核对：Python 包 itur 0.4.0（P.676-12，氧气部分与 -13 相同）的 gamma0_exact 在 60 / 61 / 77 GHz 给 14.6511 / 15.0369 / 0.0962 dB/km，与本条一致。77 GHz 的 0.096 只有 fmcw_radar 原记 0.4 dB/km 的四分之一左右：标准大气（7.5 g/m³）下水汽另有 0.251 dB/km，合计 0.348 dB/km，0.4 应是总气体衰减而不是氧气。"

  itu_p676.gamma_o_dry_sea_level_peak:
    value: {f_ghz: 60.81, db_per_km: 15.06}
    unit: "GHz, dB/km"
    source: derived
    cite: "同 itu_p676.gamma_o_dry_sea_level，在 50–70 GHz 内以 0.01 GHz 步长取最大值"
    note: "公式同上。海平面上 60 GHz 附近的谱线并成一个宽吸收带（原文 'Near 60 GHz, many oxygen absorption lines merge together at sea-level pressures to form a single, broad absorption band'），峰值 15.06 dB/km 在 60.81 GHz。fmcw_radar 原记的'约 15 dB/km'指的就是这个峰；它的 60 GHz 中心频点本身是 14.651。"
