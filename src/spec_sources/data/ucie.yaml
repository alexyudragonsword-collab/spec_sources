    unit: text
    source: spec
    cite: "D. Das Sharma, 'Universal Chiplet Interconnect Express (UCIe): Building an open chiplet ecosystem', UCIe Consortium white paper, 2022-02（UCIe 1.0），www.uciexpress.org/_files/ugd/0c1418_c5970a68ab214ffc97fab16d11581449.pdf；2026-11-14 读原文；UCIe Consortium, Hot Chips 2023 UCIe tutorial, 'Electrical, Form-Factor, and Compliance'（slides 52–81，'Property of Universal Chiplet Interconnect Express (UCIe) 2023'），hc2023.hotchips.org/assets/program/tutorials/ucie/Electrical%20Form%20Factor%20and%20Compliance.pdf；2026-11-14 读原文"
