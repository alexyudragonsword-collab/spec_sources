# pa60 —— 60 GHz CMOS 功率放大器的测量值（读过原文），与只由它们推出的 derived。
#
# 标签：spec（对过原文，带 quote 与 section）/ survey（未核实，note 写明）/ derived（只由本库的 spec、
# survey 条目推出，note 或 cite 是公式）。本表不收 assumed：哪个库自己的取舍留在那个库的本地表。
# 只有条目自己的标签行写成"标签词 + 冒号"，说明文字里不写，所以对四个标签各跑一次 grep -c
# 都恰好等于该标签的条目数（tests/test_iron_rules.py 跑真的 grep）。
#
# 出处：条目从 mmw60_trx@13024e0b012923071d827cc557b0da5eb9a9b2aa src/mmw60/data/spec/survey.yaml
# 逐字迁入，每个字段与源表相等（tests/test_extraction.py 对 tests/fixtures/ 里的副本逐条比）。
# 所以 cite / note 里的"本库"指 mmw60_trx，cairn/…、examples/…、tests/…、config.…、frontend.… 是它仓库里的路径，
# assumed.* 是它本地表里的条目；这些写法在条目下一次因核实而改动时改成明确的库名（ROADMAP）。
#
# 例外：pa60.chan_isscc2009、pa60.lai_isscc2010、pa60.law_isscc2010、pa60.tanomura_isscc2008 四条不是迁入的，
# 是 spec_sources 在里程碑 2 第 1 批读 Asada Table I 转引的原文后新建的；它们的 cite / note 写明库名，不用"本库"。
#
# 前缀：pa60.*。
# 迁入前的节注释：三篇（asada_eumc2011、wu_asscc2012、ning_elex2011）都是东工大 Okada / Matsuzawa 组的
# 65 nm CMOS PA，PDF 在作者实验室站点上，直接下载读原文（2026-11-12）；与 rx60.comm_asada2011 同组同工艺。

entries:

  # ------------------------------------------------------------ 测量值（读过原文）
  pa60.asada_eumc2011:
    value: {gain_db: 23.2, p1db_dbm: 10.0, psat_dbm: 14.6, pae_peak: 0.163, pae_at_p1db: 0.079, pdc_mw: 135.0, vdd_v: 1.2}
    unit: "dB, dBm, dBm, ratio, ratio, mW, V"
    source: spec
    cite: "H. Asada, K. Matsushita, K. Bunsen, K. Okada, A. Matsuzawa, 'A 60 GHz CMOS Power Amplifier Using Capacitive Cross-Coupling Neutralization with 16 % PAE'（Tokyo Institute of Technology）；作者实验室站点 publications/2011/EuMC/asdh_EuMC2011_v5_paper.pdf，会议名按文件路径是 EuMC 2011，PDF 本身没有印；2026-11-12 读原文"
    section: "Abstract；测量结果一节（Fig. 10）；Table I"
    quote: "The 3-stage differential power amplifier is fabricated in a 65 nm CMOS process and evaluated with 1.2 V power supply. The power amplifier achieves power gain of 23.2 dB, output power of 10 dBm at 1 dB compression point, saturated output power of 14.6 dBm, peak PAE of 16.3 %, and power consumption of 135 mW. [...] The measured PAE at 1 dB compression point and the measured peak PAE are 7.9 % and 16.3 %, respectively."
    note: "60 GHz 单音测量（Fig. 10）。Psat − P1dB = 4.6 dB，在同一篇 Table I 收的 14 个 60 GHz CMOS PA 里偏软（中位 3.3 dB，见 pa60.eumc2011_table1）。'surveyed' 一档的 PA 取它（assumed.pa60_surveyed_pick）。原文没有 AM/PM。"

  pa60.wu_asscc2012:
    value: {vpa_1v0: {psat_dbm: 13.2, p1db_dbm: 10.2, pae_peak: 0.150}, vpa_0v7: {psat_dbm: 10.1, p1db_dbm: 5.8, pae_peak: 0.081}, evm_qpsk_db: {pout_5dbm: -18.6, pout_10dbm: -17.7}}
    unit: "dBm, dBm, ratio; dB"
    source: spec
    cite: "R. Wu, Y. Tsukui, R. Minami, K. Okada, A. Matsuzawa, 'A 0.7 V-to-1.0 V 10.1 dBm-to-13.2 dBm 60-GHz Power Amplifier Using Digitally-Assisted LDO Considering HCI Issues'（Tokyo Institute of Technology）；作者实验室站点 publications/2012/A-SSCC/WU_ASSCC2012_final.pdf；2026-11-12 读原文"
    section: "Abstract；测量结果一节（Fig. 6、Fig. 9）；Table I"
    quote: "The PA is capable of outputting 13.2 dBm saturation power (Psat), 10.2 dBm power at 1-dB compression point (P1dB) and achieving 15.0% peak power-added efficiency (PAE). [...] The P1dB is reduced from 10.2 dBm to 5.8 dBm when VPA is [reduced] [...] the measured EVM is from 11.7% (-18.6 dB) to 12.9% (-17.8 dB) for low output power (Pout = 5 dBm) [...] While at high output power (Pout = 10 dBm), the measurement value of the EVM is 13.1% (-17.7 dB)"
    note: "末级电源 VPA 1.0 / 0.7 V 两档。Psat − P1dB = 3.0 / 4.3 dB。EVM 是 802.15.3c 信道 3、3.52 Gb/s QPSK，整个测试链读的，不只是 PA；到 P1dB 附近（10 dBm）也只差 0.9 dB，说明这组 EVM 被别的东西（仪器、调制器）限住，不能拿来定 PA 的线性度。"

  pa60.ning_elex2011:
    value: {gain_db: 9.8, p1db_dbm: 9.4, psat_dbm: 11.7, pae_peak: 0.143, pae_at_p1db: 0.120}
    unit: "dB, dBm, dBm, ratio, ratio"
    source: spec
    cite: "N. Li, K. Matsushita, K. Okada, A. Matsuzawa, 'A 14.3% PAE parallel class-A and AB 60 GHz CMOS PA', IEICE Electronics Express vol. 8 no. 13, pp. 1071–1074, 2011, doi 10.1587/elex.8.1071；作者实验室站点 publications/2011/IEICE/Ning_ELEX.pdf；2026-11-12 读原文"
    section: "3 Experimental results；Table I"
    quote: "A peak gain of 14.6 dB at 49 GHz and a 9.8-dB gain at 60 GHz are achieved. [...] The measured saturation output power is 11.7 dBm and the power at 1 dB compression point is 9.4 dBm. A maximum power added efficiency (PAE) of 14.3% and 12.0% at 1 dB compression point are realized at 60 GHz."
    note: "并联 A / AB 类。Psat − P1dB = 2.3 dB。"

  pa60.eumc2011_table1:
    value:
      columns: [ref, node_nm, gain_db, p1db_dbm, psat_dbm, pae_peak_pct]
      rows:
        - ["[1]", 65, 16.0, 2.5, 11.5, 11.0]
        - ["[2]", 65, 19.2, 15.1, 17.7, 11.1]
        - ["[5]", 90, 8.3, 8.2, 10.6, 5.0]
        - ["[6]", 90, 20.6, 18.2, 19.9, 14.2]
        - ["[7]", 90, 10.0, 8.8, 12.6, 6.9]
        - ["[8]", 90, 4.4, 12.1, 14.2, 5.8]
        - ["[9]", 90, 30.0, 10.3, 13.8, 12.6]
        - ["[10]", 90, 20.0, 8.2, 12.0, 9.0]
        - ["[11]", 90, 25.0, 5.0, 8.0, 7.0]
        - ["[12]", 90, 17.0, 5.1, 8.4, 5.8]
        - ["[13]", 90, 15.2, 10.0, 11.0, 8.2]
        - ["[14]", 90, 5.5, 9.0, 12.3, 8.8]
        - ["[15]", 65, 14.3, 11.0, 16.6, 4.9]
        - ["this work", 65, 23.2, 10.0, 14.6, 16.3]
    unit: "nm, dB, dBm, dBm, %"
    source: spec
    cite: "pa60.asada_eumc2011 那篇的 Table I 'Performance comparison'；2026-11-12 读原文"
    section: "Table I. Performance comparison"
    quote: "TABLE I PERFORMANCE COMPARISON. Technology | Power Gain[dB] | P1dB [dBm] | Psat [dBm] | Peak PAE[%] | Power[mW] | VDD [V]"
    note: "这张表是那篇论文对 2007–2011 年 60 GHz CMOS PA 的汇编，表里其他各行是它转引的。spec_sources 读了其中 4 行的原文（里程碑 2 第 1 批）：[1] pa60.chan_isscc2009、[2] pa60.lai_isscc2010、[6] pa60.law_isscc2010、[13] pa60.tanomura_isscc2008，P1dB、Psat、峰值 PAE 都与原文各自的对比表逐格相同；只有增益两格不同：[1] 原文表是 15.8（这里 16.0）；[13] 的 15.2 是原文 0.7 V 时 60 GHz 的线性增益，同一行另外三格是 1.0 V 的（1.0 V 线性增益 14.3）。其余 9 行 mmw60_trx 与 spec_sources 都没有读原文。用来看量级与分布，不用作基准档。14 行的 Psat 8–19.9 dBm（中位 12.45），Psat − P1dB 1.0–9.0 dB（中位 3.3）。只有 [1] 一行（9.0 dB）接近 11ad 评估方法学那颗 Rapp 的 9.5 dB，而原作者自己把这颗 PA 的 P1dB 偏低归于各级偏置不当造成的提前压缩（pa60.chan_isscc2009）；去掉这一行，最大是 [15] 的 5.6 dB（原文未读）。峰值 PAE 4.9–16.3 %。"

  pa60.wu_isscc2015:
    value: {tx_pout_at_evm_limit_dbm: 9.3, evm_limit_db: -21.0, pa_p1db_dbm: 7.0, tx_evm_best_db: -27.9}
    unit: "dBm, dB, dBm, dB"
    source: spec
    cite: "R. Wu, S. Kawai, Y. Seo, … K. Okada, A. Matsuzawa, 'An HCI-Healing 60GHz CMOS Transceiver', IEEE ISSCC 2015, paper 19.5（Tokyo Institute of Technology）；作者实验室站点上的报告幻灯片 publications/2015/201502_ISSCC/wu/20150225_ISSCC2015_wu_v21.pdf；2026-11-12 读原文，两张图渲染出来读"
    section: "幻灯片 24 'Measured Pin-Pout of the PA'（读图）、26 'Measured TX EVM versus Pout'、27 '60GHz TRX Performance Comparison'"
    quote: "Measured TX EVM versus Pout: IEEE802.11ad MCS12(16QAM) specification [line at -21 dB]; 7Gb/s; Fresh 9dBm … Comparison: Pout/each PA (dBm) — Tokyo Tech [1] 8.5* @TX EVM = -21dB (*Estimated from literature); This work 9.3 @TX EVM = -21dB … The transceiver demonstrates an EVM of -27.9dB and can transmit 7Gb/s in 16QAM within 2.16GHz"
    note: "65 nm 60 GHz 收发机，单载波 16-QAM（802.11ad MCS12，7 Gb/s）。整个发射机的 TX EVM 在平均输出 9.3 dBm 时碰到 802.11ad 16-QAM 的 −21 dB 限（幻灯片 26 的曲线、27 的表）。单独的 PA 的 P1dB 约 7.0 dBm（幻灯片 24，读图，'Fresh' 的 P1dB 符号，accelerated measurement 条件）——单载波在 P1dB 之上约 2.3 dB 还满足限值。−21 dB 是幻灯片上标的规范线，802.11ad 条文本身没有读。这一条给的是'按 EVM 限定额定输出'这个读法（assumed.pa60_operating_rule），不是 OFDM 的工作点：单载波的峰均比比 OFDM 低得多。"

  # ------------------------------------------------------------ Asada Table I 转引的原文（读过原文；里程碑 2 第 1 批）
  # 四篇都是 ISSCC 文摘，用户从 IEEE Xplore 下载、spec_sources 读（2026-11-13）。PDF 只放本地 cairn/Reference/。
  # 先读的是 Table I 里 Psat − P1dB 的两端（[1] 9.0 dB、[13] 1.0 dB）与 Psat 的两端（[6] 19.9、[2] 17.7 dBm）。
  pa60.chan_isscc2009:
    value: {gain_db: 15.8, p1db_dbm: 2.5, psat_dbm: 11.5, pae_peak: 0.11, pdc_mw: 43.5, vdd_v: 1.0}
    unit: "dB, dBm, dBm, ratio, mW, V"
    source: spec
    cite: "W. L. Chan, J. R. Long, M. Spirito, J. J. Pekarik, 'A 60GHz-Band 1V 11.5dBm Power Amplifier with 11% PAE in 65nm CMOS', ISSCC 2009 Dig. Tech. Papers, paper 22.4, pp. 380–381, doi 10.1109/ISSCC.2009.4977467；Asada Table I 的 [1]；2026-11-13 读原文，Fig. 22.4.5 的表格是嵌入字体，渲染出来读"
    section: "正文第 1、3 段；Fig. 22.4.3（58 GHz 大信号）；Fig. 22.4.5 'Comparison of 60GHz-band PAs'"
    quote: "Operating from a 1V supply, the PA achieves a saturated output power of 11.5dBm with 11% peak PAE at 58GHz. [...] The maximum saturated output power is 11.5dBm, with a peak PAE close to 11% at 9dBm output power. [...] However, its low 1dB compressed output power may be due to premature compression caused by non-optimal biasing of the individual stages. [...] Fig. 22.4.5: Technology | Gain [dB] | P1dB [dBm] | Psat [dBm] | Peak PAE [%] | DC Power [mW] (Vsupply [V]); 65nm CMOS (this work) | 15.8 | 2.5 | 11.5 | 11 | 43.5 (1.0)"
    note: "65 nm 三级差分、各级中和电容，1.0 V。大信号测量在 58 GHz；小信号 S21 峰值 15.4 dB 在 60 GHz（正文）。Psat − P1dB = 9.0 dB，是 pa60.eumc2011_table1 里最大的一格，与 Asada 转引的相同（Asada 的增益写 16.0，原文表是 15.8）。原作者自己说 P1dB 偏低可能是各级偏置不当造成的提前压缩，所以这 9.0 dB 不宜当作 60 GHz CMOS PA 压缩曲线的代表。"

  pa60.lai_isscc2010:
    value: {vdd_v: [0.9, 1.0], gain_db: [18.9, 19.2], p1db_dbm: [13.0, 15.1], psat_dbm: [16.8, 17.7], pae_peak: [0.108, 0.111], text_p1db_dbm: [13.3, 15.4], text_psat_dbm: [17.0, 17.9]}
    unit: "V, dB, dBm, dBm, ratio, dBm, dBm"
    source: spec
    cite: "J.-W. Lai, A. Valdes-Garcia, 'A 1V 17.9dBm 60GHz Power Amplifier in Standard 65nm CMOS', ISSCC 2010 Dig. Tech. Papers, paper 23.6, pp. 424–425（MediaTek、IBM）；Asada Table I 的 [2]；2026-11-13 读原文"
    section: "正文测量一段（Fig. 23.6.4，61.5 GHz）；Fig. 23.6.7 'Summary of the state-of-the-art 60-GHz silicon PAs' 的 This work 一列"
    quote: "At 0.9V VDD, the Psat is 17dBm and OP1dB is 13.3dBm at 61.5GHz. 17.9dBm Psat and 15.4dBm OP1dB are measured when 1V VDD is applied. Including all DAs and UAs, the peak PAE at 1V VDD is 11.7%. [...] +17dBm Psat and +14dBm OP1dB over 57GHz to 65GHz are maintained [...] Fig. 23.6.7, This work: Process 1V 65nm CMOS; Vsupply (V) 0.9 / 1.0; Frequency 60GHz; Gain (dB) 18.9 / 19.2; OP1dB (dBm) 13.0 / 15.1; PSAT (dBm) 16.8 / 17.7; Peak PAE (%) 10.8 / 11.1"
    note: "四路变压器功率合成，IBM 65 nm，A 类 460 mA。原文前后不一：正文（与题名）在 61.5 GHz、1.0 V 时是 Psat 17.9 / OP1dB 15.4 dBm、峰值 PAE 11.7 %（text_* 两列；0.9 V 那列的 17.0 正文写作 17dBm），汇总表 Fig. 23.6.7 是 17.7 / 15.1 dBm、11.1 %。Asada Table I 的 [2] 抄的是汇总表 1.0 V 一列，四格相同。Psat − P1dB：汇总表 2.6 dB，正文 2.5 dB。57–65 GHz 全带 Psat ≥ +17、OP1dB ≥ +14 dBm（正文）。"

  pa60.law_isscc2010:
    value: {gain_db: 20.6, p1db_dbm: 18.2, psat_dbm: 19.9, pae_peak: 0.142, vdd_v: 1.2}
    unit: "dB, dBm, dBm, ratio, V"
    source: spec
    cite: "C. Y. Law, A.-V. Pham, 'A High-Gain 60GHz Power Amplifier with 20dBm Output Power in 90nm CMOS', ISSCC 2010 Dig. Tech. Papers, paper 23.7, pp. 426–427（UC Davis）；Asada Table I 的 [6]；2026-11-13 读原文"
    section: "正文测量一段；Fig. 23.7.4（60 GHz 功率扫描）；Fig. 23.7.6 'Comparison of state-of-the-art CMOS power amplifiers' 的 This Work 一列"
    quote: "The PA has experimentally achieved 20.6dB of gain at 60GHz and 3dB bandwidth of 8GHz (58 to 66GHz). [...] The power-added efficiency of the PA peaks at 14.2% when Pin is around 4dBm at 60GHz. Moreover, this PA achieves +18dBm of P1dB and 20dBm of Psat. [...] Fig. 23.7.6, This Work 90nm CMOS: Voltage (V) 1.2; Freq (GHz) 60; Topology 4 way Power Combine; P1dB (dBm) 18.2; Max. Pout (dBm) 19.9; Max PAE (%) 14.2; Gain (dB) 20.6"
    note: "TSMC 90 nm，六个两级共源放大器经 Wilkinson 分 / 合路。正文的 +18 / 20 dBm 是取整，对比表是 18.2 / 19.9（表头写 Max. Pout，这里记作 psat_dbm）。Asada Table I 的 [6] 四格与对比表相同。Psat − P1dB = 1.7 dB；Psat 19.9 dBm 是 Table I 最高的一格。原文没给直流功耗。"

  pa60.tanomura_isscc2008:
    value: {vdd_v: [0.7, 1.0], gain_db: [13.9, 14.3], gain_tol_db: [1.4, 1.3], p1db_dbm: [5.2, 10.0], p1db_tol_db: [0.3, 0.5], psat_dbm: [8.3, 11.0], psat_tol_db: [0.2, 0.5], pae_peak_min: [0.067, 0.082], pdc_mw: [89.0, 150.0]}
    unit: "V, dB, dB, dBm, dB, dBm, dB, ratio, mW"
    source: spec
    cite: "M. Tanomura, Y. Hamada, S. Kishimoto, M. Ito, N. Orihashi, K. Maruhashi, H. Shimawaki, 'TX and RX Front-Ends for 60GHz Band in 90nm Standard Bulk CMOS', ISSCC 2008 Dig. Tech. Papers, paper 31.1, pp. 558–559（NEC）；Asada Table I 的 [13]；2026-11-13 读原文，Fig. 31.1.3 与 31.1.6 是嵌入字体，渲染出来读"
    section: "正文 PA 一段；Fig. 31.1.3（60 GHz，漏压 0.7 / 1.0 V）；Fig. 31.1.6 'Measured performance summary for transmitter, receiver and PA' 的 PA 一栏（60–64 GHz）"
    quote: "At drain voltage of 0.7V, the PA achieves an output power of 8.4dBm with a power gain of 10.3dB and power added efficiency (PAE) of 7.0%, and a linear gain of 15.2dB. [...] When the drain voltage is increased to 1.0V, the PA delivers an output power of 11.3dBm with a gain of 13.3dB and 1dB gain compression output power (P1dB) of 10.5dBm. [...] Fig. 31.1.6, PA: Frequency 60-64GHz; Output RF power 8.3±0.2dBm @ Vd=0.7V, 11.0±0.5dBm @ Vd=1.0V; P-1dB 5.2±0.3dBm @ Vd=0.7V, 10.0±0.5dBm @ Vd=1.0V; PAE (max) > 6.7% @ 0.7 V, > 8.2% @ 1.0V; Linear gain 13.9±1.4dB @ Vd=0.7V, 14.3 ± 1.3dB @ Vd=1.0V; Power dissipation 89mW @ 0.7V, 150mW @ 1.0V"
    note: "90 nm 三级单端共源，按热载流子寿命把工作漏压定在 0.7 V，1.0 V 另测一档。value 是汇总表 60–64 GHz 的值与 ± 范围；表里写的是 'Output RF power'，即扫描到 Pin = 0 dBm 时的最高输出（1.0 V 时增益已压缩约 5 dB），Asada、Chan、Lai 的对比表都把它列作 Psat，这里记作 psat_dbm；PAE 原文只给下限（'>'）。Asada Table I 的 [13] 一行：P1dB 10.0、Psat 11.0、PAE 8.2 是 1.0 V 的汇总值，增益 15.2 却是正文 0.7 V 时 60 GHz 的线性增益。Psat − P1dB：汇总表 1.0 dB（两项各有 ±0.5 dB），是 Table I 里最小的一格；正文在 60 GHz、1.0 V 给的 P1dB 10.5 dBm 与增益 13.3 dB 时的输出 11.3 dBm 只差 0.8 dB，Fig. 31.1.3 里 Pin = 0 dBm 时约 11.5 dBm（读图）。"

  # ------------------------------------------------------------ 推导：tgad_em.pa_model_shape 的 modified Rapp 对上 pa60.asada_eumc2011 的 Psat − P1dB
  pa60.asada_eumc2011_rapp_p:
    value: 1.286
    unit: Rapp smoothness p
    source: derived
    cite: "pa.rapp.ModifiedRappPA(p=…) 使 10·log10(P_sat / P1dB) = pa60.asada_eumc2011 的 psat_dbm − p1db_dbm（4.6 dB）；tgad_em 的 g / A_sat 不变，P1dB 在 Psat 下几 dB 只由 p 决定"
    note: "单调求根，三位小数（1.286 时差 4.60 dB）。对照：tgad_em.pa_rapp_p = 0.81 对应 9.5 dB；Table I 的中位 3.3 dB 对应 p ≈ 1.57。tests/test_pa60.py 复算。"
