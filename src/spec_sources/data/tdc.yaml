# tdc —— 时间数字转换器（TDC）的测量值：分辨率、单次精度、线性度，与只由它们推出的 derived。
#
# 标签：spec（对过原文，带 quote 与 section）/ survey（未核实，note 写明）/ derived（只由本库的 spec、
# survey 条目推出，note 或 cite 是公式）。本表不收 assumed：哪个库自己的取舍留在那个库的本地表。
# 只有条目自己的标签行写成"标签词 + 冒号"，说明文字里不写，所以对四个标签各跑一次 grep -c
# 都恰好等于该标签的条目数（tests/test_iron_rules.py 跑真的 grep）。
#
# 出处：里程碑 2 第 2 批（fmcw_radar 的 TDC 抖动占位）。本库直接读原文建条目，不是从哪个库迁入的。
# 嵌在某颗 ADPLL 里、随环路一起报的 TDC 数在 adpll60.yaml；这里放 TDC 自己的论文。
# 前缀：tdc.*。

entries:

  # ------------------------------------------------------------ 局部无源插值 TDC（90 nm）
  tdc.henzler_isscc2008:
    value: {res_s: 4.7e-12, res_vdd_1v4_s: 3.9e-12, single_shot_precision_lsb: 0.7, inl_lsb: 1.2, dnl_lsb: 0.6, interpolation: 4, vdd_v: 1.2, f_op_mhz: 180.0, idd_ma: 3.0, energy_pj: 19.0, node_nm: 90}
    unit: "s, s, LSB, LSB, LSB, -, V, MHz, mA, pJ, nm"
    source: spec
    cite: "S. Henzler, S. Koeppe, W. Kamp, H. Mulatz, D. Schmitt-Landsiedel, '90nm 4.7ps-Resolution 0.7-LSB Single-Shot Precision and 19pJ-per-Shot Local Passive Interpolation Time-to-Digital Converter with On-Chip Characterization', ISSCC 2008 Dig. Tech. Papers, paper 30.5, pp. 548–549（Infineon、TU München），IEEE Xplore 4523300；Wu, Staszewski, Long（JSSC 2014）的参考文献 [35]；用户从 IEEE Xplore 下载，2026-11-14 读原文，图表渲染出来读"
    section: "正文测量一段；Fig. 30.5.4 'Measured single-shot precision'；Fig. 30.5.6 'Comparison with prior-art' 的 this 一行"
    quote: "Thermal noise causing kT/C noise at the comparator inputs is negligible for signal slopes in the order of the gate delay. [...] The circuit is implemented in a 90nm standard CMOS process with 4× interpolation. The resolution is 4.7ps at 1.2V and 3.9ps at 1.4V supply. The intrinsic monotony indeed translates into a strict monotonic converter characteristics. An integral nonlinearity of ±1.2 LSB and a differential nonlinearity of ±0.6 LSB are achieved. Beside the linearity, the single-shot precision is an important metric to describe the time resolution capability. It is defined as the standard deviation of the codewords at the output if a constant time interval is measured repeatedly. [...] For repeated measurements of slowly varying signals, the finite single-shot precision dithers the output values, so averaging of multiple measurements results reduces the quantization error, i.e., increases the effective resolution. [...] For an operation frequency of 180MHz at 1.2V, the supply current is 3mA corresponding to an energy of 19pJ/measurement. [...] Fig. 30.5.4: single shot precision = 0.7 LSB. Fig. 30.5.6, this: loc. passive interpol. | tech. 90 nm | resol. 4.7 ps | single shot precision 0.7 LSB | INL 1.2 LSB, 5.6 ps | DNL 0.6 LSB, 2.8 ps | power 14 | area 0.02 mm²"
    note: "差分延迟线给粗量化，相邻两级之间用电阻做 4 倍无源插值，比较器是灵敏放大器。单次精度 = 对同一恒定时间间隔反复测量时输出码字的标准差（原文定义），Fig. 30.5.4 与对比表都写 0.7 LSB（图上是一段细粒度延迟扫描，原文没说 0.7 是平均还是最大）；按秒是 tdc.henzler_isscc2008_single_shot_s。这个标准差里除了 TDC 自身的随机时间误差，还含码字的离散化与片上表征单元（Fig. 30.5.2）产生起止脉冲的抖动，所以它是这颗 TDC 自身抖动的上界量级，不是直接测得的输入参考抖动；若按 Sheppard 修正 √(0.7² − 1/12) 粗算，噪声本身约 0.64 LSB ≈ 3.0 ps（近似，不登记）。原文点明有限的单次精度给输出加了 dither。结构与 Wu 2014 的伪差分延迟链 TDC（adpll60.wu_jssc2014_tdc，65 nm、12.2 ps）不同；同一张对比表里 Staszewski 2006 的延迟链 TDC 一栏没有单次精度。"

  tdc.henzler_isscc2008_single_shot_s:
    value: 3.29e-12
    unit: s
    source: derived
    cite: "tdc.henzler_isscc2008 的 single_shot_precision_lsb × res_s"
    note: "公式：0.7 LSB × 4.7 ps = 3.29 ps（1.2 V）。单次精度的秒数，给按秒读 TDC 抖动的库引用（引用不做换算）。它是输出码字的标准差，含离散化与测试脉冲的抖动，见 tdc.henzler_isscc2008 的 note。"
